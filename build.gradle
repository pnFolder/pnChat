plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'ru.privatenull'
version = '1.1.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

def pnLibraryVersion = '0.0.1-dev.6'

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    // The shared runtime plugin is installed by the pnLibrary bootstrap that is shaded into the jar;
    // only its public API is needed to compile.
    implementation "io.github.pnfolder:pnlibrary-bootstrap-bukkit:${pnLibraryVersion}"
    compileOnly "io.github.pnfolder:pnlibrary-api:${pnLibraryVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
    // Runtime services (lifecycle, updates, metrics, logging) belong to the installed pnLibrary plugin.
    relocate 'org.pnfolder.pnlibrary.bootstrap', 'ru.privatenull.pnchat.libs.pnbootstrap'
    relocate 'org.pnfolder.pnlibrary.bukkit.bootstrap', 'ru.privatenull.pnchat.libs.pnbootstrap.bukkit'
    relocate 'org.pnfolder.pnlibrary.console', 'ru.privatenull.pnchat.libs.pnbootstrap.console'
    relocate 'com.google.gson', 'ru.privatenull.pnchat.libs.gson'
}

configurations.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
}

tasks.build {
    dependsOn tasks.shadowJar
}

tasks.processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}
